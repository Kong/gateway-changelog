name: Release changelog generator
on:
  release:
    types: [created]

# Nothing by default; the job below gets only what it needs.
permissions: {}

jobs:
  release:
    name: Release Go Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the release
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # Release builds start from a clean state, without a restored cache.
        cache: false

    - name: Test
      run: make test

    - name: govulncheck
      run: make vulncheck

    # Pass the tag to the script as a quoted argument rather than a make variable.
    - name: Build release assets
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        make generate
        ./scripts/build-release.sh "$RELEASE_TAG" dist

    - name: Upload release assets
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
