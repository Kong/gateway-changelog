name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # Uses the `toolchain` directive in go.mod (falls back to `go`), so CI
        # builds with exactly the pinned Go release.
        go-version-file: go.mod

    - name: Build
      run: make build

    - name: Test
      run: make test

    - name: govulncheck
      run: make vulncheck

    - name: Release packaging
      run: make dist VERSION=ci
